[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clockify-unofficial-cli"
version = "1.1.0"
description = "Unofficial command-line interface for Clockify, built on clockify-unofficial-sdk."
readme = "README.md"
license = "MIT"
authors = [
  { name = "G.A.JAGUAR", email = "dev@gajaguar.com" },
]
requires-python = ">=3.14"
keywords = ["clockify", "time-tracking", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "clockify-unofficial-sdk>=1.10.1,<2",
  "keyring>=25.0",
  "platformdirs>=4.0",
  "pydantic>=2.9",
  "rich>=14.0",
  "tomli-w>=1.0",
  "typer>=0.16",
]

[project.scripts]
clockify = "clockify_unofficial_cli.main:run"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90 -m 'not live'"
markers = [
  "live: hits the real Clockify API (requires CLOCKIFY_TEST_API_KEY)",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 119
lint.select = ["ALL"]
lint.ignore = ["CPY", "D", "missing-trailing-comma"]
lint.isort.force-single-line = true
lint.isort.case-sensitive = true
# Typer resolves command signatures at runtime, so their annotation imports must stay real imports.
lint.per-file-ignores."src/clockify_unofficial_cli/commands/**/*.py" = ["typing-only-standard-library-import", "typing-only-third-party-import"]
lint.per-file-ignores."tests/**/*.py" = ["ARG", "boolean-type-hint-positional-argument", "magic-value-comparison", "assert"]

[tool.mypy]
strict = true
exclude = ["tests/"]

[tool.pylint.main]
load-plugins = ["pylint_gajaguar"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["gajaguar"]

[tool.pyright]
include = ["src"]

[dependency-groups]
dev = [
  "conventional-git>=1.3",
  "mypy>=2.3.1",
  "pylint-gajaguar>=2.0.1",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "respx>=0.22",
  "ruff>=0.16.8",
  "skills-ref>=0.1.1",
]
