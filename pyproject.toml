[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "clockify-unofficial-cli"
version = "0.2.0"
description = "Unofficial command-line interface for Clockify, built on clockify-unofficial-sdk."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "G.A.JAGUAR", email = "dev@gajaguar.com" },
]
requires-python = ">=3.14"
keywords = ["clockify", "time-tracking", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "clockify-unofficial-sdk>=1.0,<2",
  "keyring>=25.0",
  "platformdirs>=4.0",
  "pydantic>=2.9",
  "rich>=14.0",
  "tomli-w>=1.0",
  "typer>=0.16",
]

[project.scripts]
clockify = "clockify_unofficial_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/clockify_unofficial_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=90 -m 'not live'"
markers = [
  "live: hits the real Clockify API (requires CLOCKIFY_TEST_API_KEY)",
]

[tool.coverage.run]
source = ["src/clockify_unofficial_cli"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py314"
line-length = 119
lint.select = ["ALL"]
lint.ignore = ["missing-trailing-comma", "CPY", "D"]
lint.isort.force-single-line = true
lint.isort.case-sensitive = true
# Typer resolves command signatures at runtime, so their annotation imports must stay real imports.
lint.per-file-ignores."src/clockify_unofficial_cli/commands/**/*.py" = ["typing-only-first-party-import", "typing-only-third-party-import", "typing-only-standard-library-import"]
lint.per-file-ignores."tests/**/*.py" = [ "ANN", "ARG", "boolean-type-hint-positional-argument", "magic-value-comparison", "assert", "private-member-access"]

[tool.mypy]
strict = true
exclude = ["tests/"]

[tool.pylint.main]
load-plugins = ["pylint_gajaguar"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["gajaguar"]

[tool.pyright]
include = ["src"]
exclude = ["**/.venv", "**/node_modules", "tests"]

[dependency-groups]
dev = [
  "conventional-git>=1.1",
  "mypy>=2.3.1",
  "pylint-gajaguar>=2.0",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "respx>=0.22",
  "ruff>=0.16.8",
]

[tool.uv.sources]
clockify-unofficial-sdk = { git = "https://github.com/gajaguar/clockify-sdk", tag = "v1.0.0" }
